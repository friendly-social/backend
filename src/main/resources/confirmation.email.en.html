<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <title>Friedly: Verify your email address</title>
</head>
<body style="width:100% !important; height:100%; margin:0; padding:0; background-color:#F5F7F9; color:#292E31; font-family:Arial,'Helvetica Neue',Helvetica,sans-serif; line-height:1.4;">

  <!-- Outer wrapper -->
  <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F5F7F9;">
    <tr>
      <td align="center" style="padding:20px 0;">

        <!-- Logo -->
        <table width="520" cellpadding="0" cellspacing="0" border="0">
          <tr>
            <td align="left" style="padding:15px 30px;">
              <img src="https://getfriend.ly/app-icon-banner.png" alt="Friendly" height="35" border="0" style="border:0; display:block;" />
            </td>
          </tr>
        </table>

        <!-- Email body background -->
        <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#ffffff; border-top:1px solid #E7EAEC; border-bottom:1px solid #E7EAEC;">
          <tr>
            <td align="center">

              <!-- Email content -->
              <table width="520" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="padding:30px 30px 20px 30px;">

                    <!-- Heading -->
                    <h1 style="margin:0 0 10px 0; color:#292E31;
                        font-size:19px; font-weight:bold;text-align:center;">Verify your email address</h1>
                    <p style="margin:0 0 20px 0; color:#292E31; font-size:14px; text-align:center;">Use this single-time code to login in the app:</p>

                    <!-- Code digits -->
                    <table cellpadding="0" cellspacing="0" border="0" align="center">
                      <tr>
                        <!-- Digit 1 -->
                        <td style="border:2px solid #839197; border-radius:10px; padding:10px 10px; font-size:1.2em; color:#292E31; text-align:center; font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;">{0}</td>
                        <td>&nbsp;</td>
                        <!-- Digit 2 -->
                        <td style="border:2px solid #839197; border-radius:10px; padding:10px 10px; font-size:1.2em; color:#292E31; text-align:center; font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;">{1}</td>
                        <td>&nbsp;</td>
                        <!-- Digit 3 -->
                        <td style="border:2px solid #839197; border-radius:10px; padding:10px 10px; font-size:1.2em; color:#292E31; text-align:center; font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;">{2}</td>
                        <td>&nbsp;</td>
                        <!-- Digit 4 -->
                        <td style="border:2px solid #839197; border-radius:10px; padding:10px 10px; font-size:1.2em; color:#292E31; text-align:center; font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;">{3}</td>
                        <td>&nbsp;</td>
                        <!-- Separator -->
                        <td style="vertical-align:middle;">
                          <table cellpadding="0" cellspacing="0" border="0"><tr><td height="2" style="background-color:#839197; font-size:0; line-height:0; padding:0 9px;">&nbsp;</td></tr></table>
                        </td>
                        <td>&nbsp;</td>
                        <!-- Digit 5 -->
                        <td style="border:2px solid #839197; border-radius:10px; padding:10px 10px; font-size:1.2em; color:#292E31; text-align:center; font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;">{4}</td>
                        <td>&nbsp;</td>
                        <!-- Digit 6 -->
                        <td style="border:2px solid #839197; border-radius:10px; padding:10px 10px; font-size:1.2em; color:#292E31; text-align:center; font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;">{5}</td>
                        <td>&nbsp;</td>
                        <!-- Digit 7 -->
                        <td style="border:2px solid #839197; border-radius:10px; padding:10px 10px; font-size:1.2em; color:#292E31; text-align:center; font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;">{6}</td>
                        <td>&nbsp;</td>
                        <!-- Digit 8 -->
                        <td style="border:2px solid #839197; border-radius:10px; padding:10px 10px; font-size:1.2em; color:#292E31; text-align:center; font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;">{7}</td>
                      </tr>
                    </table>

                  </td>
                </tr>

                <!-- Footer / body-sub -->
                <tr>
                  <td style="border-top:1px solid #E7EAEC; padding:10px 30px; text-align:center;">
                    <p style="margin:0; font-size:14px; color:#839197;">If you didn't request any code, just ignore this message</p>
                  </td>
                </tr>

              </table>
            </td>
          </tr>
        </table>

      </td>
    </tr>
  </table>

</body>
</html>
